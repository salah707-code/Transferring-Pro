name: Validate Phase 1

on:
  push:
    branches:
      - phase1/restore-foundation
  pull_request:
    branches:
      - phase1/restore-foundation
  workflow_dispatch:

concurrency:
  group: validate-phase1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Phase 1 — Veltrix validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: |
          set -euo pipefail
          echo "Installing npm packages"
          npm ci || npm install

      - name: Run npm checks & build
        run: |
          set -euo pipefail
          echo "Running npm run check"
          npm run check
          echo "Running npm run build"
          npm run build

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: cargo fmt --check
        run: |
          set -euo pipefail
          cargo fmt --all -- --check

      - name: cargo check for src-tauri
        run: |
          set -euo pipefail
          cargo check --manifest-path src-tauri/Cargo.toml

      - name: Verify Phase 1 core files exist
        run: |
          set -euo pipefail
          missing=0
          test -f package.json || { echo "ERROR: package.json missing"; missing=1; }
          test -d src || { echo "ERROR: src/ directory missing"; missing=1; }
          test -f src-tauri/Cargo.toml || { echo "ERROR: src-tauri/Cargo.toml missing"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "::error::Phase 1 core files missing"
            exit 1
          fi
          echo "Phase 1 core files present"
