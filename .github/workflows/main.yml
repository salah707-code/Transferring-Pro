name: Validate (phase1)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Rust (stable) and rustfmt
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
          override: true

      - name: Install minimal native deps for Tauri (one apt-get command)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            ca-certificates \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libayatana-appindicator3-dev \
            libnotify-dev \
            libgdk-pixbuf2.0-dev \
            libnss3
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

      - name: Install npm dependencies
        run: npm install

      - name: Run npm check
        run: npm run check

      - name: Build frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Cargo check (src-tauri)
        run: cargo check --manifest-path src-tauri/Cargo.toml
